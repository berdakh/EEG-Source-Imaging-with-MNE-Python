# Source-verified metadata; runtime contract is deliberately not yet enabled.
name: brainbert
family: brainbert
description: BrainBERT self-supervised model for intracranial recordings (braindecode port)
status: available
source:
  type: hf
  repo_id: braindecode/brainbert-pretrained
  revision: main
license:
  spdx: unknown
  notes: Upstream repository ships no explicit license.
input:
  sfreq: 2048
  units: uV
  window_seconds: null
  contract_verified: false
  preprocessing:
  - Laplacian rereferencing; must be supplied before inference
  - Production STFT and normalization are performed inside the port
  validation_notes: The port accepts raw multichannel input at 2048 Hz. No fixed five-second window is
    established; minimum length depends on STFT settings. Rereferencing is not implemented here; checkpoint
    feature-output smoke test remains pending.
adapter:
  class: braindecode
  kwargs:
    model_class: BrainBERT
references:
  hf: https://huggingface.co/braindecode/brainbert-pretrained
  paper: https://openreview.net/forum?id=xmcYx_reUn6
