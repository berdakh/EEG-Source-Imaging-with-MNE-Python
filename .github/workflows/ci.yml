name: CI

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      MPLBACKEND: Agg
      EEGAGENT_PROVIDER: rule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,api]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit and integration tests (offline, synthetic data)
        run: pytest -q
      - name: Offline eval suite (rule provider, exercises the harness)
        run: eegagent --provider rule eval --json > eval_results.json || true
      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-py${{ matrix.python-version }}
          path: eval_results.json

  # Real-model evals run only when an API key is configured as a repository secret.
  eval-claude:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Eval with Claude (skipped without ANTHROPIC_API_KEY)
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "no ANTHROPIC_API_KEY secret; skipping"; exit 0; fi
          eegagent --provider anthropic eval --min-pass-rate 0.8
